<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080a0d">
  <title>Tarmo Live — Race Leaderboard</title>
  <meta name="description" content="Live one-lap race timing from Tarmo Race.">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="shell topbar">
    <a class="brand" href="/leaderboard" aria-label="Tarmo Live leaderboard">
      <span class="brand-mark">T</span>
      <span class="brand-copy">Tarmo Live<small>Race control system</small></span>
    </a>
    <span class="status-chip"><span class="status-dot" id="connection-dot"></span><span id="connection-label">Connecting</span></span>
  </header>

  <main class="shell">
    <section class="hero">
      <div>
        <div class="eyebrow">One lap. No excuses.</div>
        <h1>Chase the<br><span>fastest line.</span></h1>
      </div>
      <p class="hero-copy">Every millisecond counts. Two-sensor validated timing, live from the start–finish gate.</p>
    </section>

    <section class="race-strip waiting" id="race-strip" aria-live="polite">
      <div class="race-state">
        <div class="race-label" id="race-label">Grid status</div>
        <div class="race-name" id="race-name">Waiting for next driver</div>
      </div>
      <div class="live-time" id="live-time">--:--.---</div>
    </section>

    <section>
      <div class="section-head">
        <h2>Live classification</h2>
        <div class="meta"><span id="entry-count">0</span> classified<br>Fastest time leads</div>
      </div>
      <div class="leader-grid" id="leader-grid"></div>
    </section>
  </main>

  <script src="/static/common.js"></script>
  <script src="/static/leaderboard.js"></script>
</body>
</html>
